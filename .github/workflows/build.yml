name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.14.3' }
      - name: Download fonts (Inter and Space Grotesk, SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/space_grotesk.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
      - run: gradle assembleRelease
      # Keep the APKs of every build, so test builds can be tried without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
      # Only commits whose message contains [release] publish a new version.
      - name: Publish release
        if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="2.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk DressCast.apk
          cp wear/build/outputs/apk/release/*.apk DressCast-Watch.apk
          gh release create "v$VERSION" DressCast.apk DressCast-Watch.apk \
            --title "DressCast $VERSION" \
            --notes "Download **DressCast.apk** below and open it on your phone to install. **DressCast-Watch.apk** is the Wear OS app (tiles and a watch-face complication); install it on your watch." \
            --latest
