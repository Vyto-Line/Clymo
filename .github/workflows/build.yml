name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.14.3' }
      - run: gradle assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk DressCast.apk
          gh release create "v$VERSION" DressCast.apk \
            --title "DressCast $VERSION" \
            --notes "Download **DressCast.apk** below and open it on your phone to install." \
            --latest
