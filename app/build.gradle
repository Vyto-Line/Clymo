plugins { id 'com.android.application' }

android {
    namespace 'com.alex.dresscast'
    compileSdk 35
    defaultConfig {
        applicationId "com.alex.dresscast"
        minSdk 26
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    buildTypes {
        // Signed with the debug key so the APK installs directly on your phone.
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
